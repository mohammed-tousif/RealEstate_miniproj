# PostgreSQL for local development:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propwise
      POSTGRES_PASSWORD: propwise   # local development only
      POSTGRES_DB: propwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propwise"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
